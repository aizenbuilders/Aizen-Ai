<style>
:root{color-scheme:dark;--bg:#07090c;--panel:#0f1318;--line:#232a33;--silver:#d8dde3;--mute:#8b94a0;--blue:#5aa9e6;--gold:#d9a441;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#141a22,var(--bg));color:var(--silver);font:15px/1.55 Georgia,"Times New Roman",serif}
.sans,button,textarea,.chip{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#intro{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;transition:opacity .6s}
#intro img{width:min(320px,70vw);border-radius:18px;animation:glow 2s ease-in-out infinite alternate}
#intro p{letter-spacing:.3em;color:var(--gold);font-size:11px;margin-top:22px}
@keyframes glow{from{box-shadow:0 0 20px #5aa9e633}to{box-shadow:0 0 60px #d9a44166}}
#app{height:100%;display:flex;flex-direction:column;max-width:860px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
header img{width:42px;height:42px;border-radius:8px}
header b{letter-spacing:.22em;font-size:18px;color:#fff}
header small{display:block;color:var(--gold);font:10px system-ui;letter-spacing:.18em}
header button{margin-left:auto}
#chat{flex:1;overflow-y:auto;padding:18px 16px}
.hero{text-align:center;padding:10px 0 20px}
.hero img{width:min(230px,55vw);border-radius:16px;box-shadow:0 0 40px #5aa9e622}
.hero h2{margin:16px 0 4px;font-weight:600;color:#fff}.hero p{color:var(--mute);margin:0 auto;max-width:480px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--silver);padding:8px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--gold)}
.msg{display:flex;gap:10px;margin:14px 0}.msg.u{justify-content:flex-end}
.msg .av{width:30px;height:30px;border-radius:7px;flex:none}
.bub{max-width:86%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.u .bub{background:linear-gradient(135deg,#1c3a57,#162a3f);border:1px solid #2b5072}
.a .bub{background:var(--panel);border:1px solid var(--line)}
.bub h4{margin:8px 0 2px;color:var(--gold);font:700 12px system-ui;letter-spacing:.12em}
.bub code{background:#1a2029;padding:1px 5px;border-radius:4px}
.cp{display:block;margin-top:8px;background:none;border:1px solid var(--line);color:var(--mute);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer}
.cp:hover{color:var(--gold);border-color:var(--gold)}
form{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;max-height:140px;background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;outline:none}
textarea:focus{border-color:var(--blue)}
#send{background:linear-gradient(135deg,var(--gold),#a97a22);color:#111;border:0;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer}
#send:disabled{opacity:.5}
.ghost{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}

Core duties: scripts for referrals, prospects, invitations; appointment scripts (opening, purpose, truthful reason, two time options, confirmation, reminder, no-show follow-up); objection handling (Understand, Clarify, Respond, Invite) including "May babayaran ba?", "Busy ako", "Scam ba ito?", "Send details na lang"; respectful follow-up sequences; marketing and social-media content; roleplay practice (act as a realistic prospect, don't reveal ideal answers first, then give feedback on confidence, clarity, rapport, questions, empathy, next step, and an improved version); leadership and team coaching.
For script requests use this format when relevant: OBJECTIVE / STRATEGY / READY-TO-SEND SCRIPT / IF THEY REPLY / NEXT STEP / COACHING TIP. For simple questions answer directly. Ask only one short clarifying question if critical context is missing.
If the user pastes a prospect's message: note the likely concern (without pretending to read minds), recommend a strategy, write a ready-to-send reply, explain the next step, offer an alternative tone.
Accuracy: use company details the user provides as the primary source. Never invent products, benefits, fees, policies, compensation details, earnings, testimonials, or approvals. Distinguish verified info, general advice, and assumptions. Never guarantee income; results vary.
Ethics: be transparent about costs, respect the right to decline, no fake urgency, no pressure, no disguising recruitment as a job, stop follow-ups when someone declines. Never claim an appointment is confirmed unless the prospect agreed.
Style: concise, copy-and-paste ready scripts, plain text with short labeled sections (no markdown tables).`;
const chat=document.getElementById('chat'),t=document.getElementById('t'),send=document.getElementById('send');
let hist=[],busy=false,sample=null;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(s){return esc(s).replace(/^\*\*([A-Z][A-Z \/&'-]+:?)\*\*:?/gm,'<h4>$1</h4>').replace(/^#{1,4}\s*(.+)$/gm,'<h4>$1</h4>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')}
const chips=["Script for a sales referral","Handle: “Scam ba ito?”","Invite a friend (Taglish)","Roleplay: tough prospect","Follow up: “Pag-iisipan ko muna”","Daily action plan"];
function hero(){chat.innerHTML=`<div class="hero"><img src="${FULL}" alt="AIZEN"><h2>Welcome to AIZEN AI</h2><p>Your network marketing &amp; leadership assistant. Scripts, objections, follow-ups, roleplay and more.</p><div class="chips">${chips.map(c=>`<button class="chip" type="button">${c}</button>`).join('')}</div></div>`;
chat.querySelectorAll('.chip').forEach(b=>b.onclick=()=>ask(b.textContent))}
function add(role,text){const d=document.createElement('div');d.className='msg '+(role==='user'?'u':'a');
d.innerHTML=(role==='user'?'':`<img class="av" src="${EMB}" alt="">`)+'<div class="bub"></div>';const b=d.querySelector('.bub');
if(role==='user')b.textContent=text;else b.innerHTML=md(text);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return b}
async function ask(q){if(busy||!q.trim())return;
if(!hist.length)chat.innerHTML='';
busy=true;send.disabled=true;t.value='';t.style.height='auto';
hist.push({role:'user',content:q});add('user',q);const b=add('a','Thinking…');
try{
if(!sample)sample=await claude.use('sample');
if(!sample){b.textContent='AIZEN AI could not connect to Claude in this view. Please open the published link while signed in to claude.ai.';hist.pop();return}
const msgs=hist.map((m,i)=>i===0&&m.role==='user'?{role:'user',content:`[SYSTEM INSTRUCTIONS]\n${SYS}\n[END INSTRUCTIONS]\n\n${m.content}`}:m);
const r=await sample(msgs,{cache:false,modelTier:'default',onText:({text})=>{b.innerHTML=md(text);chat.scrollTop=chat.scrollHeight}});
hist.push({role:'assistant',content:r.text});b.innerHTML=md(r.text);
const c=document.createElement('button');c.className='cp';c.textContent='Copy';c.onclick=()=>{navigator.clipboard?.writeText(r.text).then(()=>{c.textContent='Copied ✓'},()=>{})};b.appendChild(c);
}catch(e){b.textContent=e&&e.code==='rate_limited'?'Too many requests — please wait a moment and try again.':'Sorry, something went wrong. Please try again.';hist.pop()}
finally{busy=false;send.disabled=false;t.focus()}}
document.getElementById('f').onsubmit=e=>{e.preventDefault();ask(t.value)};
t.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(t.value)}};
t.oninput=()=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px'};
document.getElementById('clr').onclick=()=>{if(busy)return;hist=[];hero()};
hero();
setTimeout(()=>{const i=document.getElementById('intro');i.style.opacity=0;setTimeout(()=>i.remove(),600)},1600);
</script></body></html>
